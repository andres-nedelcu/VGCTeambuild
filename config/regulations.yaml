# Regulation calendar. Used at ingest time to tag every live row with a regulation.
# CBD rows are tagged by ranked season (cbd_seasons), NOT by date: CBD's last M5
# snapshot is dated 10_09_2026, after M-C started. Dates are kept for other sources.
# Sources: pokemon.com M-C announcement; Game8 / Serebii season pages (checked 2026-09-16).

current: M-C

regulations:
  M-C:
    start_utc: 2026-09-09T02:00:00Z   # Sep 8, 7:00 p.m. PDT
    end_utc: 2026-12-02T01:59:00Z     # Dec 1, 5:59 p.m. PST
    cbd_seasons: [M6, M7, M8]         # M7/M8 expected, not yet published
    format_ids:
      showdown: gen9championsvgc2026regmc   # confirmed from Dex.formats (c23d2e9)
      smogon: gen9championsvgc2026regmc     # filenames are all lowercase
      limitless: null                       # not in Limitless /games as of 2026-09-16
      cbd: Doubles                          # CBD has no VGC label; ranked Doubles is the only doubles data
    limitless:
      formats: [M-C]                        # picked up automatically once Limitless adds it
      custom_name_patterns: ['\bm-c\b', '\breg(ulation)?\s*m-?c\b']   # for format CUSTOM, case-insensitive

  M-B:
    start_utc: null                   # TODO: sources disagree; only needed for non-CBD history
    end_utc: null
    cbd_seasons: [M3, M4, M5]
    format_ids:
      showdown: gen9championsvgc2026regmb
      smogon: gen9championsvgc2026regmb
      limitless: M-B
      cbd: Doubles
    limitless:
      formats: [M-B]
      custom_name_patterns: ['\bm-b\b', '\breg(ulation)?\s*m-?b\b']
