[project]
name = "vgc"
version = "0.1.0"
description = "Shared VGC data layer + Pokémon Champions teambuilding dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
